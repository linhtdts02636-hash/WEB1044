<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang kết quả</title>
    <link rel="icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&&family=Montserrat:ital,wght@0,100..900;1,100..900&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
             <div id="navbar"></div>

    <main>
        <div class="container">
            <section class="result-name mt-5">
                <div class="text-center">
                    <h3 class="hero text-danger">NGUYỄN VĂN AN</h3>
                </div>
            </section>
            <section class="score-bar p-5 mt-5 mb-5">
                <div class="grade-row">
                    <div class="grade-cell" style="left:0%">
                        <div class="grade-label">F</div>
                        <div class="grade-popup">0-5</div>
                        <div class="grade-score">0</div>
                    </div>
                    <div class="grade-cell" style="left:50%">
                        <div class="grade-label">D</div>
                        <div class="grade-popup">5-7</div>
                        <div class="grade-score">5</div>

                    </div>
                    <div class="grade-cell" style="left:70%">
                        <div class="grade-label">C</div>
                        <div class="grade-popup">7-8</div>
                        <div class="grade-score">7</div>

                    </div>
                    <div class="grade-cell" style="left:80%">
                        <div class="grade-label">B</div>
                        <div class="grade-popup">8-9</div>
                        <div class="grade-score">8</div>

                    </div>
                    <div class="grade-cell" style="left:90%">
                        <div class="grade-label">A</div>
                        <div class="grade-popup">9-10</div>
                        <div class="grade-score">9</div>

                    </div>
                    <div class="grade-cell" style="left:100%">
                        <div class="grade-label">A+</div>
                        <div class="grade-popup">10</div>
                        <div class="grade-score">10</div>
                    </div>
                    <div class="score-index" style="left:87%;">
                        <div class="score">8.7</div>
                    </div>
                </div>


                <div class="bar">
                    <div class="bar-seg" style="width:50%; background: rgb(117, 44, 44);"></div>
                    <div class="bar-seg" style="width:10%; background: rgb(180, 42, 42);"></div>
                    <div class="bar-seg" style="width:10%; background: rgb(228, 131, 21);"></div>
                    <div class="bar-seg" style="width:10%; background: rgb(247, 231, 13);"></div>
                    <div class="bar-seg" style="width:10%; background: rgb(84, 248, 7);"></div>
                    <div class="bar-seg" style="width:10%; background: rgb(0, 217, 255);"></div>
                </div>
            </section>
            <section class="score-info">
                <div class="text-center">
                    <h3 class="fw-bold">8.7 / 10</h3>
                    <h3 class="">XẾP LOẠI: B</h3>
                    <p class="mt-1 mb-0 text-primary ">Thời gian hoàn thành: 10:22:35 ngày 12/03/2026</p>
                </div>
            </section>
        </div>
    </main>

     <div id="footer"></div>
    <script src="js/footer.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/score.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
