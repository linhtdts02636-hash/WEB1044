<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang làm bài</title>
    <link rel="icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&&family=Montserrat:ital,wght@0,100..900;1,100..900&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
        <div id="navbar"></div>

    <main>
        <div class="container">
            <section class="exam-info p-5">
                <div class="text-start">
                    <h4 class="hero-title fw-bold" id="title"></h4>
                    <p class="hero-eyebrow" id="description"></p>
                </div>
                <div class="exam-info-progress d-flex align-items-center">
                    <div class="countdown-box">
                        <i class="bi bi-clock"></i>
                        <span id="countdown"></span>
                    </div>

                    <div class="question-count ms-auto"><span id="answerCount">0</span>/<span id="totalCount">0</span>
                        câu
                    </div>
                </div>
                <div class="flex-grow-1 mb-5">
                    <div class="progress ">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBar"
                            style="width:0%"></div>
                    </div>
                </div>

                <div id="questionContainer"></div>

                <div class="text-center p-3 mt-5">
                    <button class="btn btn-primary" id="submit-button">Nộp bài</button>
                </div>
            </section>
        </div>
    </main>
    <div id="footer"></div>
    <script src="js/footer.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/exam-logic.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
