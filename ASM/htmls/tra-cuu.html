<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu</title>
    <link rel="icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&&family=Montserrat:ital,wght@0,100..900;1,100..900&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <div id="navbar"></div>

    <main>
        <div class="container">
            <section class="hero-section p-5">
                <div class="container text-center">
                    <h1 class="hero-title display-3 fw-bold">TRA CỨU KẾT QUẢ </h1>
                    <p class="hero-eyebrow">Tra cứu kết quả bằng số điện thoại</p>
                </div>
            </section>

            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                <input type="text" class="form-control" id="phoneSearch" placeholder="0912345678">
                <button class="btn btn-primary" onclick="searchResults()">Tra cứu <i class="bi bi-search"></i></button>

                <div class="invalid-feedback" id="phoneMsg"></div>
            </div>
            <div class="mt-5" id="result"></div>
        </div>
    </main>

   <div id="footer"></div>
    <script src="js/footer.js"></script>
    <script src="js/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>

        function searchResults() {
            const sampleData = {
                "0918504757": [
                    { id: 1, name: "Tìm hiểu về chiến thắng Điện Biên Phủ", timeStart: "09/03/2026 14:05:10", timeEnd: "09/03/2026 14:10:19", score: 9.2, grade: "A" },
                    { id: 2, name: "Tìm hiểu về DNA và RNA", timeStart: "10/03/2026 15:05:10", timeEnd: "09/03/2026 15:10:19", score: 9.2, grade: "A" }

                ]
            }
            const phoneSearch = document.getElementById('phoneSearch');
            const errMsg = document.getElementById('phoneMsg');
            const result = document.getElementById('result');
            let valid = true
            phoneSearch.classList.remove("is-invalid");
            const phone = phoneSearch.value.trim();
            if (!phone) {
                errMsg.innerHTML = '<i class="bi bi-x-lg">  Bạn cần nhập số điện thoại để tra cứu';
                phoneSearch.classList.add("is-invalid");
                valid = false;

            } else if (!/^0\d{9}$/.test(phone)) {
                errMsg.innerHTML = '<i class="bi bi-x-lg">  Bạn cần nhập ít nhất 10 chữ số ';
                phoneSearch.classList.add("is-invalid");
                valid = false;
            }
            if (valid) {
                const data = sampleData[phone]

            }
            if (valid) {
                foundSearch();
            }
            function foundSearch() {
                const data = sampleData[phone]
                if (!data || data.length === 0) {
                    result.innerHTML = '<i class="bi bi-question-circle"> Không tìm thấy kết quả bài thi'
                    return;
                }

                const gradeClass = (g) => g === "A+" || g === "A" ? "grade-a" : g === "B" ? "grade-b" : g === "C" ? "grade-c" : g === "d" ? "grade-d" : "grade-f";

                const resultRow = data.map(r => `
                    <tr>
                        <td class="text-center">${r.id}</td>
                        <td>${r.name}</td>
                        <td>${r.timeStart}</td>
                        <td>${r.timeEnd}</td>
                        <td class="text-center">${r.score}</td>
                        <td class="text-center">${r.grade}</td>
                        <td class=""><a href="ket-qua.html" class="btn btn-primary">Xem</a></td>
                    </tr>
                `).join('');

                result.innerHTML = `
                    <p><i class="bi bi-check-circle-fill"></i> Tìm thấy ${data.length} bài thi </p>
                    <div class="table-responsive">
                        <table
                            class="table">
                            <thead>
                                <tr>
                                    <th>Mã</th>
                                    <th>Tên bài thi</th>
                                    <th>Thời gian bắt đầu</th>
                                    <th>Thời gian kết thúc</th>
                                    <th>Điểm số</th>
                                    <th>Điểm chữ</th>
                                    <th>Xem</th>
                                </tr>
                            </thead>
                            <tbody>${resultRow}</tbody>
                        </table>
                    </div>
                `
            }
        }
    </script>
</body>

</html>
