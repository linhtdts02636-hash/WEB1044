<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel="icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&&family=Montserrat:ital,wght@0,100..900;1,100..900&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="navbar"></div>

    <main>
        <div class="container">
            <section class="p-5">
                <div class="text-center mb-4">
                    <h1 class="hero-title fw-bold">ĐĂNG KÝ TÀI KHOẢN</h1>
                    <p class="hero-eyebrow">Tạo tài khoản để tham gia các bài thi trực tuyến</p>
                </div>
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="alert alert-success d-none" id="successMsg">
                            <i class="bi bi-check-circle-fill"></i> Đăng ký thành công! Đang chuyển đến trang đăng nhập...
                        </div>
                        <form id="registerForm" novalidate>
                            <div class="mb-3">
                                <label for="regName" class="form-label">Họ tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="regName" placeholder="Nguyễn Văn A">
                                <div class="invalid-feedback" id="nameErr"></div>
                            </div>
                            <div class="mb-3">
                                <label for="regEmail" class="form-label">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="regEmail" placeholder="nguyenvana@gmail.com">
                                <div class="invalid-feedback" id="emailErr"></div>
                            </div>
                            <div class="mb-3">
                                <label for="regPhone" class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="regPhone" placeholder="09xxxxxxxx" maxlength="10">
                                <div class="invalid-feedback" id="phoneErr"></div>
                            </div>
                            <div class="mb-3">
                                <label for="regPass" class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="regPass" placeholder="Ít nhất 6 ký tự">
                                <div class="invalid-feedback" id="passErr"></div>
                            </div>
                            <div class="mb-3">
                                <label for="regPassConfirm" class="form-label">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="regPassConfirm" placeholder="Nhập lại mật khẩu">
                                <div class="invalid-feedback" id="confirmErr"></div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Đăng ký <i class="bi bi-person-plus"></i></button>
                        </form>
                        <p class="text-center mt-3">Đã có tài khoản? <a href="dang-nhap.html" class="link-primary">Đăng nhập</a></p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="footer"></div>
    <script src="js/footer.js"></script>
    <script src="js/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        function getUsers() {
            return JSON.parse(localStorage.getItem("users") || "[]");
        }

        const form = document.getElementById("registerForm");
        const successMsg = document.getElementById("successMsg");

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            let valid = true;

            const inputs = [
                "regName", "regEmail", "regPhone", "regPass", "regPassConfirm"
            ];
            inputs.forEach(function (id) {
                document.getElementById(id).classList.remove("is-invalid");
            });

            const nameIn = document.getElementById("regName");
            const emailIn = document.getElementById("regEmail");
            const phoneIn = document.getElementById("regPhone");
            const passIn = document.getElementById("regPass");
            const confirmIn = document.getElementById("regPassConfirm");

            const name = nameIn.value.trim();
            const nameLetters = (name.match(/[a-zA-ZÀ-ỹ]/g) || []).length;
            if (!name || nameLetters < 2 || /\s{2,}/.test(name)) {
                nameIn.classList.add("is-invalid");
                document.getElementById("nameErr").textContent = "Họ tên không hợp lệ (ít nhất 2 chữ cái, không có 2 khoảng trắng liên tiếp).";
                valid = false;
            }

            const email = emailIn.value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailIn.classList.add("is-invalid");
                document.getElementById("emailErr").textContent = "Email không đúng định dạng.";
                valid = false;
            }

            const phone = phoneIn.value.trim();
            if (!/^0\d{9}$/.test(phone)) {
                phoneIn.classList.add("is-invalid");
                document.getElementById("phoneErr").textContent = "Số điện thoại phải gồm 10 chữ số và bắt đầu bằng số 0.";
                valid = false;
            }

            if (passIn.value.length < 6) {
                passIn.classList.add("is-invalid");
                document.getElementById("passErr").textContent = "Mật khẩu phải có ít nhất 6 ký tự.";
                valid = false;
            }

            if (passIn.value !== confirmIn.value) {
                confirmIn.classList.add("is-invalid");
                document.getElementById("confirmErr").textContent = "Mật khẩu nhập lại không khớp.";
                valid = false;
            }

            const users = getUsers();
            const emailDuplicate = users.some(function (u) { return u.email.toLowerCase() === email.toLowerCase(); });
            if (emailDuplicate) {
                emailIn.classList.add("is-invalid");
                document.getElementById("emailErr").textContent = "Email này đã được đăng ký.";
                valid = false;
            }
            if (users.some(function (u) { return u.phone === phone; })) {
                phoneIn.classList.add("is-invalid");
                document.getElementById("phoneErr").textContent = "Số điện thoại này đã được đăng ký.";
                valid = false;
            }

            if (valid) {
                users.push({ name: name, email: email, phone: phone, password: passIn.value });
                localStorage.setItem("users", JSON.stringify(users));
                form.reset();
                successMsg.classList.remove("d-none");
                setTimeout(function () {
                    window.location.href = "dang-nhap.html";
                }, 1800);
            }
        });
    </script>
</body>

</html>
